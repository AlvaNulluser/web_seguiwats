services:
  web:
    image: nginx:alpine
    container_name: web-seguiwats
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - seguiwats_network
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      # Router for www.seguiwats.com (already points to this server IP)
      - "traefik.http.routers.web-seguiwats-www.rule=Host(`www.seguiwats.com`)"
      - "traefik.http.routers.web-seguiwats-www.entrypoints=websecure"
      - "traefik.http.routers.web-seguiwats-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web-seguiwats-www.service=web-seguiwats"
      # Router for apex seguiwats.com
      - "traefik.http.routers.web-seguiwats-apex.rule=Host(`seguiwats.com`)"
      - "traefik.http.routers.web-seguiwats-apex.entrypoints=websecure"
      - "traefik.http.routers.web-seguiwats-apex.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web-seguiwats-apex.service=web-seguiwats"
      # Service definition
      - "traefik.http.services.web-seguiwats.loadbalancer.server.port=80"

networks:
  seguiwats_network:
    external: true
